version: '3'

services:
  webserver:
    image: nginx:alpine
    working_dir: /application
    volumes:
      - ./packages/api:/application
      - ./packages/api/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
    networks:
      - proconvey

  php-fpm:
    build: ./packages/api/docker/php-fpm
    working_dir: /application
    volumes:
      - ./packages/api:/application
      - ./packages/api/docker/php-fpm/overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini
      - ./packages/api/docker/php-fpm/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
    networks:
      - proconvey

  mysql:
    image: mysql/mysql-server:8.0
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: proconvey
      MYSQL_USER: proconvey
      MYSQL_PASSWORD: password
    volumes:
      - proconvey_mysql:/var/lib/mysql
    networks:
      - proconvey
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-ppassword" ]
      retries: 3
      timeout: 5s

  mailcrab:
    image: marlonb/mailcrab:latest
    ports:
      - 1025:1025
      - 1080:1080
      - 8025:1080 # For people coming from Mailhog
    networks:
      - proconvey

  redis:
    image: redis:6.2
    ports:
      - 6379:6379
    volumes:
      - proconvey_redis:/data
    networks:
      - proconvey

  minio:
    image: minio/minio
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - proconvey_minio:/data
    networks:
      - proconvey
    environment:
      MINIO_ACCESS_KEY: proconvey
      MINIO_SECRET_KEY: password
    entrypoint: sh
    command: -c 'mkdir -p /data/local && minio server /data --console-address :9001'

  setbucketpermissions:
    image: minio/mc
    depends_on:
      - minio
    networks:
      - proconvey
    entrypoint: /bin/sh -c " /usr/bin/mc config host add myminio http://minio:9000 proconvey password; /usr/bin/mc anonymous set download myminio/local; exit 0; "

networks:
  proconvey:
    driver: bridge

volumes:
  proconvey_redis:
    driver: local
  proconvey_mysql:
    driver: local
  proconvey_minio:
    driver: local
