name: proconvey
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0

environment:
  sdk: '>=2.19.2 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flutter_platform_widgets: ^3.0.0
  mobile_scanner: ^3.0.0
  graphql_flutter: ^5.1.2
  uni_links: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  flutter_native_splash: ^2.2.19

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: GT Eesti Pro
      fonts:
        - asset: assets/fonts/GTEestiProDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/GTEestiProDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/GTEestiProDisplay-Regular.ttf
          weight: 400

flutter_native_splash:
  background_image: assets/splash/background.png
  image: assets/splash/branding.png
